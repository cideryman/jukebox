<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="application-name" content="나의 주크박스" />
    <meta
      name="description"
      content="글자를 몰라도 사진을 눌러 음악을 선택할 수 있는 오프라인 주크박스"
    />
    <title>나의 주크박스</title>
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell" aria-label="나의 주크박스">
      <section
        id="jukeboxGrid"
        class="jukebox-grid"
        aria-label="음악 선택판"
      ></section>

      <button
        id="settingsTrigger"
        class="settings-trigger"
        type="button"
        aria-label="보호자 설정. 2초 동안 길게 누르세요."
        aria-describedby="settingsHint"
      >
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path
            d="M12 8.7a3.3 3.3 0 1 0 0 6.6 3.3 3.3 0 0 0 0-6.6Zm8.2 4.1v-1.6l-2-.7a7.5 7.5 0 0 0-.7-1.7l.9-1.9-1.2-1.2-1.9.9a7.5 7.5 0 0 0-1.7-.7l-.7-2h-1.7l-.7 2a7.5 7.5 0 0 0-1.7.7l-1.9-.9-1.2 1.2.9 1.9a7.5 7.5 0 0 0-.7 1.7l-2 .7v1.6l2 .7c.2.6.4 1.2.7 1.7l-.9 1.9 1.2 1.2 1.9-.9c.5.3 1.1.6 1.7.7l.7 2h1.7l.7-2c.6-.2 1.2-.4 1.7-.7l1.9.9 1.2-1.2-.9-1.9c.3-.5.6-1.1.7-1.7l2-.7Z"
          />
        </svg>
      </button>
      <span id="settingsHint" class="sr-only">설정을 열려면 2초 동안 계속 누르세요.</span>
    </main>

    <dialog id="settingsDialog" class="settings-dialog" aria-labelledby="settingsTitle">
      <div class="settings-frame">
        <div class="settings-layout">
          <header class="settings-header">
            <p class="settings-eyebrow">보호자 전용</p>
            <h1 id="settingsTitle">음악과 사진 등록</h1>
            <p class="settings-description">
              음악과 사진이 모두 등록된 칸만 주크박스 화면에 나타납니다.
            </p>
          </header>

          <p id="settingsFeedback" class="settings-feedback" role="status" aria-live="polite" hidden></p>

          <section class="storage-panel" aria-label="기기 저장소 상태">
            <div class="storage-panel-header">
              <div class="storage-stats">
                <div class="storage-stat-item">
                  <span class="storage-stat-label">저장 공간</span>
                  <strong id="storageUsageText" class="storage-stat-value">계산 중...</strong>
                </div>
                <div class="storage-stat-item">
                  <span class="storage-stat-label">영구 저장 모드</span>
                  <span id="storagePersistedBadge" class="storage-badge">확인 중</span>
                </div>
              </div>
              <div
                id="storageProgressBar"
                class="storage-progress-bar"
                role="progressbar"
                aria-valuenow="0"
                aria-valuemin="0"
                aria-valuemax="100"
                aria-label="저장 공간 사용률"
              >
                <div id="storageProgressFill" class="storage-progress-fill" style="width: 0%;"></div>
              </div>
            </div>
            <p class="storage-notice">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path
                  d="M12 9v4m0 4h.01M12 3a9 9 0 1 0 9 9 9 9 0 0 0-9-9Z"
                />
              </svg>
              <span>이 기기의 로컬 저장소(IndexedDB + OPFS)에 보관됩니다. 브라우저 데이터나 캐시를 삭제하면 등록된 파일도 함께 삭제될 수 있습니다.</span>
            </p>
          </section>

          <section id="slotEditors" class="slot-editors" aria-label="음악 칸 설정"></section>
        </div>

        <footer class="settings-footer">
          <button
            id="closeSettings"
            class="settings-confirm-button"
            type="button"
            aria-label="설정을 닫고 음악 화면으로 돌아가기"
          >확인</button>
        </footer>
      </div>
    </dialog>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <div id="liveRegion" class="sr-only" aria-live="polite"></div>
    <audio id="audioPlayer" preload="metadata"></audio>

    <noscript>
      <p class="noscript-message">이 앱을 사용하려면 브라우저에서 JavaScript를 켜야 합니다.</p>
    </noscript>

    <script type="module" src="app.js"></script>
  </body>
</html>
