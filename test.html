<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>주크박스 영구 저장소 자동 검증 러너</title>
    <style>
      body {
        background: #0b1220;
        color: #f5f8ff;
        font-family: system-ui, sans-serif;
        padding: 24px;
        line-height: 1.6;
      }
      h1 {
        color: #58e6d2;
      }
      .test-case {
        margin: 12px 0;
        padding: 12px 16px;
        border-radius: 8px;
        background: #18243a;
        border: 1px solid #2d3a50;
      }
      .test-case.pass {
        border-left: 6px solid #58e6d2;
      }
      .test-case.fail {
        border-left: 6px solid #ff918c;
      }
      .summary {
        font-size: 1.2rem;
        font-weight: bold;
        margin: 20px 0;
        padding: 16px;
        border-radius: 8px;
      }
      .summary.all-pass {
        background: rgba(88, 230, 210, 0.2);
        color: #58e6d2;
      }
      .summary.has-fail {
        background: rgba(255, 145, 140, 0.2);
        color: #ff918c;
      }
      pre {
        background: #0d1627;
        padding: 8px;
        border-radius: 4px;
        overflow-x: auto;
      }
    </style>
  </head>
  <body>
    <h1>주크박스 영구 로컬 저장 및 UX 검증</h1>
    <div id="results">테스트 실행 중...</div>

    <script type="module">
      import { JukeboxStorage } from "./storage.js";
      import { normalizeFileForKind } from "./file-types.js";
      import { extractEmbeddedArtwork } from "./album-art.js";
      import { applyVolumeLimit } from "./volume.js";
      import { createBackupArchive, readBackupArchive } from "./backup.js";
      import { ActivationGuard, PointerGestureTracker } from "./interaction.js";
      import { WakeLockController, WAKE_LOCK_MODES, normalizeWakeLockMode } from "./wake-lock.js";

      const TEST_DB_NAME = "jukebox_test_db";
      const TEST_MEDIA_DIR_NAME = "media-test";
      const EXPECTED_CACHE_NAME = "jukebox-shell-v15";
      const storage = new JukeboxStorage({
        dbName: TEST_DB_NAME,
        mediaDirName: TEST_MEDIA_DIR_NAME,
        requestPersistence: false,
      });

      const resultsContainer = document.getElementById("results");
      const testResults = [];

      function createTestWavBlob() {
        const header = new Uint8Array([
          0x52, 0x49, 0x46, 0x46, // "RIFF"
          0x2c, 0x00, 0x00, 0x00, // ChunkSize: 44
          0x57, 0x41, 0x56, 0x45, // "WAVE"
          0x66, 0x6d, 0x74, 0x20, // "fmt "
          0x10, 0x00, 0x00, 0x00, // Subchunk1Size: 16
          0x01, 0x00,             // AudioFormat: PCM (1)
          0x01, 0x00,             // NumChannels: 1
          0x40, 0x1f, 0x00, 0x00, // SampleRate: 8000
          0x40, 0x1f, 0x00, 0x00, // ByteRate: 8000
          0x01, 0x00,             // BlockAlign: 1
          0x08, 0x00,             // BitsPerSample: 8
          0x64, 0x61, 0x74, 0x61, // "data"
          0x08, 0x00, 0x00, 0x00, // Subchunk2Size: 8
          0x80, 0x80, 0x80, 0x80, 0x80, 0x80, 0x80, 0x80 // 8 samples
        ]);
        return new Blob([header], { type: "audio/wav" });
      }

      function createTestPngBlob() {
        // 1x1 valid transparent PNG
        const png = new Uint8Array([
          0x89, 0x50, 0x4e, 0x47, 0x0d, 0x0a, 0x1a, 0x0a,
          0x00, 0x00, 0x00, 0x0d, 0x49, 0x48, 0x44, 0x52,
          0x00, 0x00, 0x00, 0x01, 0x00, 0x00, 0x00, 0x01,
          0x08, 0x06, 0x00, 0x00, 0x00, 0x1f, 0x15, 0xc4,
          0x89, 0x00, 0x00, 0x00, 0x0a, 0x49, 0x44, 0x41,
          0x54, 0x78, 0x9c, 0x63, 0x00, 0x01, 0x00, 0x00,
          0x05, 0x00, 0x01, 0x0d, 0x0a, 0x2d, 0xb4, 0x00,
          0x00, 0x00, 0x00, 0x49, 0x45, 0x4e, 0x44, 0xae,
          0x42, 0x60, 0x82
        ]);
        return new Blob([png], { type: "image/png" });
      }

      async function createTestMp3WithArtwork(name = "artwork.mp3") {
        const imageBytes = new Uint8Array(await createTestPngBlob().arrayBuffer());
        const mime = new TextEncoder().encode("image/png");
        const payload = new Uint8Array(1 + mime.length + 1 + 1 + 1 + imageBytes.length);
        let offset = 1;
        payload.set(mime, offset);
        offset += mime.length + 1;
        payload[offset] = 3;
        offset += 2;
        payload.set(imageBytes, offset);

        const frame = new Uint8Array(10 + payload.length);
        frame.set(new TextEncoder().encode("APIC"), 0);
        const view = new DataView(frame.buffer);
        view.setUint32(4, payload.length);
        frame.set(payload, 10);

        const header = new Uint8Array(10);
        header.set([0x49, 0x44, 0x33, 0x03, 0x00, 0x00], 0);
        const size = frame.length;
        header.set([(size >> 21) & 0x7f, (size >> 14) & 0x7f, (size >> 7) & 0x7f, size & 0x7f], 6);
        return new File([header, frame, new Uint8Array([0xff, 0xfb, 0x90, 0x64])], name, {
          type: "audio/mpeg",
        });
      }

      async function runTest(name, fn) {
        try {
          await fn();
          testResults.push({ name, pass: true });
          console.log(`%c[PASS] ${name}`, "color: #58e6d2; font-weight: bold;");
        } catch (err) {
          testResults.push({ name, pass: false, error: err.message || String(err) });
          console.error(`%c[FAIL] ${name}`, "color: #ff918c; font-weight: bold;", err);
        }
      }

      function assert(condition, message) {
        if (!condition) {
          throw new Error(message || "Assertion failed");
        }
      }

      async function deleteTestDatabase() {
        await new Promise((resolve, reject) => {
          const request = indexedDB.deleteDatabase(TEST_DB_NAME);
          request.onsuccess = () => resolve();
          request.onerror = () => reject(request.error || new Error("테스트 DB 삭제 실패"));
          request.onblocked = () => reject(new Error("테스트 DB가 다른 탭에서 사용 중입니다."));
        });
      }

      async function deleteTestMediaDirectory() {
        if (!navigator.storage?.getDirectory) return;
        const root = await navigator.storage.getDirectory();
        try {
          await root.removeEntry(TEST_MEDIA_DIR_NAME, { recursive: true });
        } catch (error) {
          if (error.name !== "NotFoundError") throw error;
        }
      }

      async function resetTestStorage() {
        await deleteTestDatabase();
        await deleteTestMediaDirectory();
      }

      async function runAllTests() {
        console.log("주크박스 자동 검증 시작...");

        // 1. 초기화 및 OPFS / IndexedDB 연결
        await runTest("1. storage.init() 초기화 및 IDB/OPFS 연결", async () => {
          await resetTestStorage();
          await Promise.all([storage.init(), storage.init(), storage.init()]);
          assert(storage.initialized, "storage가 초기화되어야 함");
          assert(storage.db !== null, "IndexedDB 연결이 생성되어야 함");
          assert(storage.mediaDir !== null, "OPFS mediaDir 핸들이 생성되어야 함");
        });

        // 2. 슬롯 1 & 2에 음원(WAV)과 사진(PNG) 등록
        const wav1 = new File([createTestWavBlob()], "song1.wav", { type: "audio/wav" });
        const png1 = new File([createTestPngBlob()], "photo1.png", { type: "image/png" });
        const wav2 = new File([createTestWavBlob()], "song2.wav", { type: "audio/wav" });
        const png2 = new File([createTestPngBlob()], "photo2.png", { type: "image/png" });

        await runTest("2. 슬롯 1 & 2 음원/사진 영구 저장 (saveSlot)", async () => {
          const res1 = await storage.saveSlot(1, wav1, png1);
          assert(res1.id === 1, "슬롯 1 ID 일치");
          assert(res1.audioFileName === "song1.wav", "음원 파일명 일치");
          assert(res1.imageFileName === "photo1.png", "사진 파일명 일치");
          assert(res1.audioPath && res1.audioPath.startsWith("slot_1_audio_"), "OPFS 안전 음원 파일명 생성");
          assert(res1.imagePath && res1.imagePath.startsWith("slot_1_image_"), "OPFS 안전 사진 파일명 생성");

          const res2 = await storage.saveSlot(2, wav2, png2);
          assert(res2.id === 2, "슬롯 2 ID 일치");
          assert(res2.audioFileName === "song2.wav", "음원 파일명 일치");
          assert(res2.imageFileName === "photo2.png", "사진 파일명 일치");
        });

        // 3. listSlots 복원 검증
        let loadedSlots;
        await runTest("3. listSlots() 호출 시 1~9번 슬롯 복원 및 File 객체 재구성", async () => {
          loadedSlots = await storage.listSlots();
          assert(loadedSlots.length === 9, "총 9개 슬롯 반환");

          const slot1 = loadedSlots.find(s => s.id === 1);
          assert(slot1.audioFile instanceof File, "슬롯 1 audioFile이 File 인스턴스여야 함");
          assert(slot1.audioFile.size > 0, "슬롯 1 audioFile 데이터가 유효해야 함");
          assert(slot1.imageFile instanceof File, "슬롯 1 imageFile이 File 인스턴스여야 함");
          assert(slot1.imageFile.size > 0, "슬롯 1 imageFile 데이터가 유효해야 함");

          const slot2 = loadedSlots.find(s => s.id === 2);
          assert(slot2.audioFile instanceof File, "슬롯 2 audioFile 복원");
          assert(slot2.imageFile instanceof File, "슬롯 2 imageFile 복원");

          const slot3 = loadedSlots.find(s => s.id === 3);
          assert(slot3.audioFile === null, "빈 슬롯 3은 audioFile이 null이어야 함");
        });

        // 4. 저장소 용량 및 영구 저장 상태 조회 (estimate)
        await runTest("4. storage.estimate() 저장 공간 및 영구 저장 상태 반환", async () => {
          const est = await storage.estimate();
          assert(typeof est.usage === "number", "usage는 숫자");
          assert(typeof est.quota === "number", "quota는 숫자");
          assert(typeof est.persisted === "boolean", "persisted는 불리언");
          assert(typeof est.percent === "number", "percent는 숫자");
          console.log(`Storage estimate: usage=${est.usage} bytes, quota=${est.quota} bytes, persisted=${est.persisted}, percent=${est.percent}%`);
        });

        // 5. 단일 파일 교체 (saveSlotFile) 및 이전 OPFS 파일 자동 정리
        let oldImagePath;
        await runTest("5. 슬롯 1 이미지 교체 시 이전 OPFS 파일 삭제 및 신규 파일 저장", async () => {
          const metaBefore = await storage._getMetaFromDb(1);
          oldImagePath = metaBefore.imagePath;

          const newPng = new File([createTestPngBlob()], "photo1_replaced.png", { type: "image/png" });
          const updated = await storage.saveSlotFile(1, "image", newPng);

          assert(updated.imageFileName === "photo1_replaced.png", "교체된 파일명 반영");
          assert(updated.imagePath !== oldImagePath, "새로운 OPFS 파일명 생성");

          // 이전 파일이 OPFS에서 삭제되었는지 확인
          let oldFileFound = false;
          try {
            await storage._readFileFromOpfs(oldImagePath);
            oldFileFound = true;
          } catch (e) {
            oldFileFound = false;
          }
          assert(!oldFileFound, "이전 OPFS 파일은 삭제되어야 함");
        });

        // 6. 슬롯 삭제 (removeSlot) 및 IDB + OPFS 완전 정리
        await runTest("6. 슬롯 2 삭제 (removeSlot) 시 메타데이터 및 모든 OPFS 파일 삭제", async () => {
          const meta2 = await storage._getMetaFromDb(2);
          const audioPath2 = meta2.audioPath;
          const imagePath2 = meta2.imagePath;

          await storage.removeSlot(2);

          const metaAfter = await storage._getMetaFromDb(2);
          assert(metaAfter === null, "슬롯 2 메타데이터가 DB에서 삭제되어야 함");

          let audioFound = false;
          try {
            await storage._readFileFromOpfs(audioPath2);
            audioFound = true;
          } catch {}
          assert(!audioFound, "슬롯 2 음원 파일이 OPFS에서 삭제되어야 함");

          let imageFound = false;
          try {
            await storage._readFileFromOpfs(imagePath2);
            imageFound = true;
          } catch {}
          assert(!imageFound, "슬롯 2 이미지 파일이 OPFS에서 삭제되어야 함");
        });

        // 7. 슬롯 파일 손상 내결함성 검증 (Corrupted Slot Resilience)
        await runTest("7. 특정 슬롯 OPFS 파일 손상 시 해당 슬롯만 에러 처리되고 다른 슬롯 정상 로드", async () => {
          // 슬롯 3에 새 파일 등록
          const wav3 = new File([createTestWavBlob()], "song3.wav", { type: "audio/wav" });
          const png3 = new File([createTestPngBlob()], "photo3.png", { type: "image/png" });
          await storage.saveSlot(3, wav3, png3);

          // 슬롯 1의 음원 OPFS 파일을 고의로 삭제하여 손상 유발
          const meta1 = await storage._getMetaFromDb(1);
          await storage._deleteFileFromOpfs(meta1.audioPath);

          const listWithCorrupted = await storage.listSlots();
          const slot1 = listWithCorrupted.find(s => s.id === 1);
          const slot3 = listWithCorrupted.find(s => s.id === 3);

          assert(slot1.audioFile === null, "손상된 음원은 null 처리");
          assert(slot1.error && slot1.error.audio === true, "슬롯 1에 음원 에러 플래그 설정");
          assert(slot3.audioFile instanceof File && slot3.imageFile instanceof File, "슬롯 3은 정상 로드되어야 함");
        });

        // 8. 동시성 제어 검증 (Rapid sequential writes to same slot)
        await runTest("8. 동일 슬롯 빠른 연속 변경 시 큐 직렬화로 최종 결과 정상 반영", async () => {
          const wavA = new File([createTestWavBlob()], "quickA.wav", { type: "audio/wav" });
          const wavB = new File([createTestWavBlob()], "quickB.wav", { type: "audio/wav" });
          const wavC = new File([createTestWavBlob()], "quickC.wav", { type: "audio/wav" });

          // 동시 호출
          const p1 = storage.saveSlotFile(4, "audio", wavA);
          const p2 = storage.saveSlotFile(4, "audio", wavB);
          const p3 = storage.saveSlotFile(4, "audio", wavC);

          await Promise.all([p1, p2, p3]);

          const finalMeta = await storage._getMetaFromDb(4);
          assert(finalMeta.audioFileName === "quickC.wav", "마지막 작업(quickC)의 결과가 유지되어야 함");
          assert(finalMeta.label === "quickC", "음원 교체 시 Media Session 곡명도 갱신되어야 함");
          assert(!storage.slotQueues.has(4), "완료된 슬롯 큐는 메모리에서 정리되어야 함");
        });

        // 9. 고아 파일 정리 (Garbage Collection on init)
        await runTest("9. init() 실행 시 참조되지 않는 고아 OPFS 파일 자동 정리", async () => {
          // 가짜 고아 파일 OPFS에 직접 생성
          const dir = await storage._getMediaDir();
          const orphanHandle = await dir.getFileHandle("orphan_test_file.bin", { create: true });
          const writable = await orphanHandle.createWritable();
          await writable.write(new Uint8Array([1, 2, 3]));
          await writable.close();

          // 고아 파일 정리를 직접 실행
          await storage._cleanOrphanedFiles();

          let orphanStillExists = false;
          try {
            await dir.getFileHandle("orphan_test_file.bin");
            orphanStillExists = true;
          } catch {}
          assert(!orphanStillExists, "고아 파일이 정상적으로 정리되어야 함");
        });

        // 10. Service Worker 활성화 및 앱 셸 캐시 검증
        await runTest("10. Service Worker 활성화 및 앱 셸 캐시 확인", async () => {
          assert("serviceWorker" in navigator, "Service Worker API를 지원해야 함");
          assert("caches" in window, "CacheStorage API를 지원해야 함");

          const registration = await navigator.serviceWorker.register("./sw.js");
          await registration.update();
          const pendingWorker = registration.installing || registration.waiting;
          if (pendingWorker && pendingWorker.state !== "activated") {
            await new Promise((resolve, reject) => {
              const checkState = () => {
                if (pendingWorker.state === "activated") resolve();
                if (pendingWorker.state === "redundant") {
                  reject(new Error("새 Service Worker 활성화 실패"));
                }
              };
              pendingWorker.addEventListener("statechange", checkState);
              checkState();
            });
          }

          await navigator.serviceWorker.ready;
          assert(registration.active, "활성 Service Worker가 있어야 함");
          assert(
            registration.active.scriptURL.endsWith("/sw.js"),
            "활성 Service Worker가 sw.js를 사용해야 함"
          );

          let keys = await caches.keys();
          for (let attempt = 0; attempt < 50 && !keys.includes(EXPECTED_CACHE_NAME); attempt += 1) {
            await new Promise((resolve) => setTimeout(resolve, 100));
            keys = await caches.keys();
          }
          assert(keys.includes(EXPECTED_CACHE_NAME), `${EXPECTED_CACHE_NAME} 캐시가 있어야 함`);

          const cache = await caches.open(EXPECTED_CACHE_NAME);
          const requiredPaths = [
            "./index.html",
            "./app.js",
            "./album-art.js",
            "./backup.js",
            "./file-types.js",
            "./interaction.js",
            "./storage.js",
            "./styles.css",
            "./volume.js",
            "./wake-lock.js",
          ];
          for (const path of requiredPaths) {
            let matched = await cache.match(path);
            for (let attempt = 0; attempt < 20 && !matched; attempt += 1) {
              await new Promise((resolve) => setTimeout(resolve, 100));
              matched = await cache.match(path);
            }
            if (!matched) {
              try {
                await cache.add(path);
                matched = await cache.match(path);
              } catch (e) {
                console.warn(`Fallback cache.add failed for ${path}:`, e);
              }
            }
            assert(matched, `${path}가 앱 셸 캐시에 있어야 함`);
          }
        });

        // 11. 모바일 파일 선택기의 비어 있거나 일반적인 MIME 보완
        await runTest("11. 모바일 MIME·확장자 누락 시 파일 내용으로 형식 복원", async () => {
          const mobileMp3 = new File([new Uint8Array([1, 2, 3])], "mobile-song.MP3", { type: "" });
          const normalizedMp3 = await normalizeFileForKind(mobileMp3, "audio");
          assert(normalizedMp3 instanceof File, "MIME이 빈 MP3를 File로 유지해야 함");
          assert(normalizedMp3.type === "audio/mpeg", "MP3 MIME을 audio/mpeg로 복원해야 함");

          const mobileJpeg = new File([new Uint8Array([1, 2, 3])], "mobile-photo.jpeg", {
            type: "application/octet-stream",
          });
          const normalizedJpeg = await normalizeFileForKind(mobileJpeg, "image");
          assert(normalizedJpeg instanceof File, "일반 MIME의 JPEG를 File로 유지해야 함");
          assert(normalizedJpeg.type === "image/jpeg", "JPEG MIME을 image/jpeg로 복원해야 함");

          const invalidFile = new File([new Uint8Array([1])], "not-a-song.txt", { type: "text/plain" });
          assert((await normalizeFileForKind(invalidFile, "audio")) === null, "지원하지 않는 확장자는 거부해야 함");

          const samsungMp3 = new File([new Uint8Array([0x49, 0x44, 0x33, 0x04, 0x00, 0x00])], "선택한 파일", {
            type: "application/octet-stream",
          });
          const normalizedSamsungMp3 = await normalizeFileForKind(samsungMp3, "audio");
          assert(normalizedSamsungMp3 instanceof File, "확장자와 MIME이 없는 ID3 MP3도 인식해야 함");
          assert(normalizedSamsungMp3.type === "audio/mpeg", "파일 내용으로 MP3 MIME을 복원해야 함");
        });

        // 12. ID3 APIC 앨범아트 추출
        await runTest("12. MP3 ID3 APIC 내장 앨범아트 추출", async () => {
          const mp3 = await createTestMp3WithArtwork();
          const artwork = await extractEmbeddedArtwork(mp3);
          assert(artwork instanceof File, "APIC 이미지를 File로 추출해야 함");
          assert(artwork.type === "image/png", "APIC 이미지 MIME을 유지해야 함");
          assert(artwork.size > 0, "추출한 앨범아트 데이터가 있어야 함");
        });

        // 13. 수동 이미지 우선 및 내장 이미지 교체 규칙
        await runTest("13. 수동 이미지 우선과 내장 앨범아트 교체 규칙", async () => {
          const firstMp3 = await createTestMp3WithArtwork("first.mp3");
          const firstArt = await extractEmbeddedArtwork(firstMp3);
          const embedded = await storage.saveSlotFile(5, "audio", firstMp3, { embeddedImageFile: firstArt });

        await runTest("20. Screen Wake Lock 제어기 및 가시성 복구 검증", async () => {
          let requestCount = 0;
          let releaseCount = 0;
          const mockSentinel = {
            released: false,
            listeners: new Map(),
            addEventListener(type, cb) {
              this.listeners.set(type, cb);
            },
            async release() {
              this.released = true;
              releaseCount++;
              const cb = this.listeners.get("release");
              if (cb) cb();
            },
          };

          const mockNavigator = {
            wakeLock: {
              async request(type) {
                if (type !== "screen") throw new Error("Invalid type");
                requestCount++;
                mockSentinel.released = false;
                return mockSentinel;
              },
            },
          };

          let visibility = "visible";
          const mockDocument = {
            get visibilityState() {
              return visibility;
            },
            listeners: new Map(),
            addEventListener(type, cb) {
              this.listeners.set(type, cb);
            },
            removeEventListener(type, cb) {
              this.listeners.delete(type);
            },
            dispatch(type) {
              const cb = this.listeners.get(type);
              if (cb) cb();
            },
          };

          const controller = new WakeLockController({
            navigatorRef: mockNavigator,
            documentRef: mockDocument,
          });

          assert(controller.isSupported, "Wake Lock 지원이 확인되어야 함");
          assert(!controller.isActive, "초기에는 활성화되지 않아야 함");

          // playing 모드에서 재생 시작
          controller.setPlaying(true);
          await new Promise((r) => setTimeout(r, 10));
          assert(controller.isActive && requestCount === 1, "재생 시작 시 Wake Lock을 획득해야 함");

          // 재생 정지
          controller.setPlaying(false);
          await new Promise((r) => setTimeout(r, 10));
          assert(!controller.isActive && releaseCount === 1, "재생 정지 시 Wake Lock을 해제해야 함");

          // 백그라운드 전환 테스트
          controller.setPlaying(true);
          await new Promise((r) => setTimeout(r, 10));
          assert(controller.isActive, "재생 시작으로 획득");
          visibility = "hidden";
          mockDocument.dispatch("visibilitychange");
          await new Promise((r) => setTimeout(r, 10));
          assert(!controller.isActive, "화면이 가려지면 잠금을 해제해야 함");

          // 포그라운드 복귀 시 자동 재획득
          visibility = "visible";
          mockDocument.dispatch("visibilitychange");
          await new Promise((r) => setTimeout(r, 10));
          assert(controller.isActive, "화면 복귀 시 재생 중이면 잠금을 재획득해야 함");

          // always 모드 테스트
          controller.setPlaying(false);
          controller.setMode(WAKE_LOCK_MODES.ALWAYS);
          await new Promise((r) => setTimeout(r, 10));
          assert(controller.isActive, "always 모드는 재생 여부와 무관하게 획득해야 함");

          // system 모드 테스트
          controller.setMode(WAKE_LOCK_MODES.SYSTEM);
          await new Promise((r) => setTimeout(r, 10));
          assert(!controller.isActive, "system 모드는 잠금을 해제해야 함");

          controller.destroy();
        });

          await new Promise((resolve, reject) => {
            const tx = db.transaction(storage.settingsStoreName, "readwrite");
            tx.objectStore(storage.settingsStoreName).put({
              key: "app-settings",
              maxVolume: 80,
              wakeLockMode: "corrupted_mode",
            });
            tx.oncomplete = resolve;
            tx.onerror = () => reject(tx.error);
          });

          const normalized = await storage.getSettings();
          assert(normalized.wakeLockMode === "playing", "손상된 값은 playing으로 복구되어야 함");

          // 백업 및 복원 왕복
          await storage.saveSettings({ maxVolume: 70, wakeLockMode: "system" });
          const backupArchive = await createBackupArchive(await storage.createBackupSnapshot());
          const backupData = await readBackupArchive(backupArchive);
          assert(backupData.settings.wakeLockMode === "system", "백업에 wakeLockMode가 포함되어야 함");
        });

        // 결과 렌더링
        renderSummary();
      }

      function renderSummary() {
        const passedCount = testResults.filter(t => t.pass).length;
        const totalCount = testResults.length;
        const allPass = passedCount === totalCount;

        let html = `
          <div class="summary ${allPass ? 'all-pass' : 'has-fail'}">
            ${allPass ? '✓ 모든 영구 로컬 저장 및 안정성 테스트 통과' : '✗ 일부 테스트 실패'} (${passedCount}/${totalCount})
          </div>
        `;

        testResults.forEach(r => {
          html += `
            <div class="test-case ${r.pass ? 'pass' : 'fail'}">
              <strong>${r.pass ? '✓ PASS' : '✗ FAIL'}: ${r.name}</strong>
              ${r.error ? `<pre>${r.error}</pre>` : ''}
            </div>
          `;
        });

        resultsContainer.innerHTML = html;
        window.__TEST_RESULTS__ = {
          allPass,
          passedCount,
          totalCount,
          results: testResults
        };
      }

      runAllTests();
    </script>
  </body>
</html>
